# Secret-leak rules applied to Corpus 1 chunks (knowledge restriction).
# A chunk matching ANY `terms` AND ANY `context` gets its scopes replaced by
# `scopes` and receives `gate` (if given): only those NPCs, and only once the
# gate is satisfied, can retrieve it. Prevents e.g. Hulda learning from the
# Saadia wiki page that Saadia is "Iman".
rules:
  saadia_identity:
    terms: ["Iman", "Taneth", "betrayed"]
    context: ["Saadia"]
    scopes: ["personal:saadia"]
    gate: {quest_id: "Skyrim:In My Time Of Need"}
  companions_werewolves:
    terms: ["werewol", "beast blood", "beastblood", "lycanthrop", "Hircine's", "transform into a beast"]
    context: ["Companions", "Circle", "Kodlak", "Aela", "Skjor", "Vilkas", "Farkas", "Jorrvaskr", "Underforge"]
    scopes: ["faction:the_circle_companions", "personal:kodlak_whitemane", "personal:aela_the_huntress",
             "personal:vilkas", "personal:farkas", "personal:skjor"]
    gate: {quest_id: "Skyrim:Proving Honor", completed: true}
  thorald_prisoner:
    terms: ["Northwatch"]
    context: ["Thorald"]
    scopes: ["personal:avulstein_gray_mane", "personal:thorald_gray_mane"]
    gate: {quest_id: "Skyrim:Missing In Action"}
  jon_olfina_romance:
    terms: ["love", "romance", "in love", "lover"]
    context: ["Jon Battle-Born", "Olfina"]
    require_all_context: true
    scopes: ["personal:jon_battle_born", "personal:olfina_gray_mane"]
  delphine_blades:
    terms: ["Blades", "Blade", "Sky Haven"]
    context: ["Delphine"]
    scopes: ["personal:delphine", "faction:blades"]
    gate: {quest_id: "Skyrim:A Blade in the Dark"}
  nelkir_whispering_door:
    terms: ["Mephala", "whispers", "Whispering Door", "Ebony Blade"]
    context: ["Nelkir"]
    scopes: ["personal:nelkir"]
